plugins {
    id 'com.android.application' version '9.3.1'
}

static def getDate() { return new Date().format('yyyyMMdd') }

def getVersionName = {
    // Get the last version tag, as well as the short head of the last commit
    String TAG = ""
    String semVer = "1.1.7"
    // Used by the fallback for github actions
    String TAG_PART_COMMIT = ""
    String TAG_STRING

    try {
        TAG = providers.exec {
            commandLine 'git', 'describe', '--tags'
            ignoreExitValue = true
        }.getStandardOutput().asText.get()
    } catch (Exception e) {
        e.printStackTrace()
    }

    // Fallback for action builds
    if (TAG.toString().trim().isEmpty()) {
        try {
            TAG_PART_COMMIT = providers.exec {
                commandLine 'git', 'describe', '--always', '--tags'
                ignoreExitValue = true
            }.getStandardOutput().asText.get()
        } catch (Exception ignored) {
        }
    }


    if(!TAG.isBlank()){
        TAG_STRING = TAG
    }else {
        if(TAG_PART_COMMIT.isBlank()){
             //Fallback no repo
            return ("LOCAL-" + "${getDate()}")
        }else {
            // Used by github actions
            TAG_STRING =  'amethyst-legacy-' + "${getDate()}" + "-" + TAG_PART_COMMIT.toString().trim()
        }

    }

    def isRelease = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
    if(!isRelease){
        return TAG_STRING.trim().replace("-g", "-") + "-" + "debug-" + semVer
    }else {
        return TAG_STRING.trim().replace("-g", "-") + "-" + "release-" + semVer
    }
}

def getCFApiKey = {
    String key = System.getenv("CURSEFORGE_API_KEY");
    if(key != null) return key;
    File curseforgeKeyFile = new File("$projectDir/curseforge_key.txt");
    if(curseforgeKeyFile.canRead() && curseforgeKeyFile.isFile()) {
        return curseforgeKeyFile.text;
    }
    logger.warn('BUILD: You have no CurseForge key, the curseforge api will get disabled !');
    return "DUMMY";
}

configurations {
    instrumentedClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

// CI passes its run number; anything else is a local build.
def pisanKusBuild = (System.getenv("PISANKUS_BUILD") ?: "1") as int
// Android has its own deliberately slow version line. CI passes the version
// only when an Android release is intentionally cut.
def pisanKusVersion = System.getenv("PISANKUS_VERSION") ?: "1.1." + pisanKusBuild

android {
    namespace 'net.kdt.pojavlaunch'

    compileSdk = 37


    signingConfigs {
        customDebug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // PisanKus release key. Every value comes from the environment so the
        // private key never enters the repository: anyone holding it could sign
        // a package Android would accept as a genuine PisanKus update.
        //
        // With no key configured the block stays empty and the release build is
        // simply left unsigned, which keeps the build green for anyone who
        // clones this without the secrets.
        customRelease {
            def keystore = System.getenv("PISANKUS_KEYSTORE_FILE")
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv("PISANKUS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PISANKUS_KEY_ALIAS")
                keyPassword System.getenv("PISANKUS_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.pisankus.client"
        minSdkVersion 21
        targetSdkVersion 34
        // Android decides whether one package upgrades another purely by
        // versionCode. Upstream left it at a constant 10000000, so every build
        // looked like the same version and an installed copy never accepted a
        // newer one.
        //
        // The build number alone cannot replace it: a run number like 80 is far
        // below 10000000, so already-installed copies read the new package as a
        // downgrade and refuse it outright with "App not installed". Keeping the
        // old constant as a floor makes every published build sort above every
        // build that came before the change, and above each other.
        versionCode 10000000 + pisanKusBuild
        versionName pisanKusVersion

        // Exposed as a resource so the settings screen can show it without any
        // code to look it up.
        resValue "string", "pisankus_version", pisanKusVersion
        multiDexEnabled true //important
        resValue 'string', 'curseforge_api_key', getCFApiKey()
        externalNativeBuild {
            ndkBuild {
                // Fix for Windows command line length limit
                arguments "APP_SHORT_COMMANDS=true"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.customDebug
            resValue "string", "app_name", "PisanKus Client (Debug)"
            resValue "string", "app_short_name", "PisanKus Client (Debug)"
            resValue 'string', 'application_package', 'com.pisankus.client.debug'
            resValue 'string', 'storageProviderAuthorities', 'com.pisankus.client.scoped.gamefolder.debug'
            resValue 'string', 'shareProviderAuthority', 'com.pisankus.client.scoped.controlfolder.debug'
        }
        proguard {
            initWith debug
            minifyEnabled true
            shrinkResources true
        }
        proguardNoDebug {
            initWith proguard
            debuggable false
        }

        release {
            // Don't set to true or java.awt will be a.a or something similar.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the project key when one is configured, and otherwise
            // with the debug keystore that is already in this repository.
            //
            // Android refuses to install an unsigned APK, so the experimental
            // download needs *a* signature. Falling back to the committed key
            // means nobody has to manage secrets to get an installable build —
            // at the cost that the key is public, so it cannot prove a package
            // came from us. That is an accepted trade for an experimental build
            // and the reason to set PISANKUS_KEYSTORE_FILE before any real
            // public release.
            signingConfig System.getenv("PISANKUS_KEYSTORE_FILE") ? signingConfigs.customRelease : signingConfigs.customDebug
            // defaultConfig already set
            // multiDexEnabled = true
            // debuggable = true
            resValue "string", "app_name", "PisanKus Client"
            resValue "string", "app_short_name", "PisanKus Client"
            resValue 'string', 'storageProviderAuthorities', 'com.pisankus.client.scoped.gamefolder'
            resValue 'string', 'application_package', 'com.pisankus.client'
        }
    }

    ndkVersion = "27.3.13750724"

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libcutils.so']
            pickFirsts += ['**/libbytehook.so']
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

afterEvaluate {
    def componentJars = [
            ":forge_installer:jar",
            ":arc_dns_injector:jar",
            ":MioLibPatcher:jar",
            ":jre_lwjgl3glfw:jar"
    ]

    tasks.withType(com.android.build.gradle.tasks.MergeSourceSetFolders).configureEach { t ->
        t.dependsOn(componentJars)
    }

    // Needed or else the release builds complain about undeclared dependencies
    tasks.matching { it.name.toLowerCase().contains("lint") }.configureEach { t ->
        t.dependsOn(componentJars)
    }
}

