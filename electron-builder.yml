appId: com.opbay.client
productName: Opbay Client
copyright: Copyright © 2026 Opbay

directories:
  output: release
  buildResources: resources

# Game files are large and user-specific, so nothing is bundled with the installer.
files:
  - out/**/*
  - package.json

# The "OP" badge from the download page, rendered from resources/icon.svg.
# electron-builder derives the .ico and .icns from it; the copy below is what the
# running app hands to BrowserWindow on Linux.
icon: resources/icon.png

extraResources:
  - from: resources/icon.png
    to: icon.png

# File names are written out literally rather than through ${arch}: the download
# page links to fixed URLs, and ${arch} does not expand the same way for every
# target (a deb renders x64 as "amd64", which would break the link).
win:
  # Handed over ready-made: electron-builder would otherwise convert the png into
  # a single 256px entry and leave Windows to downscale it for every small slot.
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Opbay Client
  artifactName: OpbayClient-win-x64.${ext}

mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [x64, arm64]
  # Two architectures, so this one keeps the placeholder.
  artifactName: OpbayClient-mac-${arch}.${ext}

linux:
  category: Game
  # A lone 1024px png would leave desktops downscaling it into a panel slot, so
  # Linux gets the whole hicolor set instead. Rendered by scripts/icons.mjs.
  icon: resources/icons
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  # Debian packages require a maintainer; without one the build fails outright.
  maintainer: Opbay <opbay@users.noreply.github.com>

appImage:
  artifactName: OpbayClient-linux-x64.AppImage

deb:
  artifactName: OpbayClient-linux-x64.deb

publish:
  provider: github
  owner: pisanadam
  repo: Opbay-client-
