<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PisanKusGaming • Modrinth İndirme Sayacı</title>
<style>
:root{--card-w:480px;--card-h:360px;--safe-x:48px;--safe-y:48px;--green:#1bd96a;--white:#f7f9fb;--muted:rgba(247,249,251,.68);--line:rgba(255,255,255,.10)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}#stage{position:relative;width:100vw;height:100vh;background:transparent}.card{position:absolute;right:var(--safe-x);bottom:var(--safe-y);width:var(--card-w);height:var(--card-h);padding:30px;border:1px solid var(--line);border-radius:28px;background:radial-gradient(120% 130% at 100% 0%,rgba(27,217,106,.18),transparent 46%),linear-gradient(145deg,rgba(17,22,26,.96),rgba(9,12,14,.92));box-shadow:0 18px 60px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--white);display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:16px}.avatar-wrap{width:68px;height:68px;flex:0 0 68px;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,rgba(27,217,106,.26),rgba(27,217,106,.08));border:2px solid rgba(27,217,106,.72);box-shadow:0 0 28px rgba(27,217,106,.14);position:relative}.avatar-wrap::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}.avatar{width:100%;height:100%;display:block;object-fit:cover}.identity{min-width:0}.name{font-size:25px;font-weight:800;letter-spacing:-.45px;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:7px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(27,217,106,.9)}.stats{margin-top:42px}.label{color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}.value{font-variant-numeric:tabular-nums;font-size:64px;line-height:.98;font-weight:900;letter-spacing:-2.4px;text-shadow:0 0 28px rgba(255,255,255,.05);transform-origin:left center}.footer{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px;font-weight:700}.meta{text-align:right;line-height:1.5}.status{display:inline-flex;align-items:center;gap:7px;margin-top:5px}.pulse{width:7px;height:7px;border-radius:50%;background:var(--green)}.loading .pulse{animation:pulse 1.1s ease-in-out infinite}.error .pulse{background:#ffb24d}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.18)}}.bar{position:absolute;left:28px;right:28px;bottom:0;height:3px;overflow:hidden;border-radius:999px 999px 0 0;background:rgba(255,255,255,.04)}.bar::after{content:"";display:block;width:100%;height:100%;background:linear-gradient(90deg,transparent,var(--green),transparent);animation:scan 2.8s linear infinite;opacity:.75}@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.value.bump{animation:valueBump .5s ease}@keyframes valueBump{0%{transform:scale(1);filter:brightness(1)}40%{transform:scale(1.06);filter:brightness(1.18)}100%{transform:scale(1);filter:brightness(1)}}@media(max-width:700px){:root{--card-w:min(480px,calc(100vw - 40px));--card-h:calc(var(--card-w)*.75);--safe-x:20px;--safe-y:20px}.card{padding:24px}.avatar-wrap{width:58px;height:58px;flex-basis:58px}.name{font-size:22px}.value{font-size:54px}.stats{margin-top:30px}}
</style>
</head>
<body>
<div id="stage">
  <section class="card loading" id="card" aria-label="Modrinth toplam indirme sayacı">
    <div class="top">
      <div class="avatar-wrap"><img class="avatar" id="avatar" alt="PisanKusGaming profil fotoğrafı" /></div>
      <div class="identity"><div class="name">PisanKusGaming</div><div class="sub"><span class="dot"></span> Modrinth profili</div></div>
    </div>
    <div class="stats"><div class="label">Toplam İndirme</div><div class="value" id="downloads">—</div></div>
    <div class="footer"><div>Canlı Modrinth sayacı</div><div class="meta"><div><span id="projects">—</span> proje</div><div class="status"><span class="pulse"></span><span id="statusText">Güncelleniyor</span></div></div></div>
    <div class="bar"></div>
  </section>
</div>
<script>
(() => {
  const USERNAME="pisankusgaming";
  const REFRESH_MS=15000;
  const PROJECTS_API=`https://api.modrinth.com/v2/user/${encodeURIComponent(USERNAME)}/projects`;
  const USER_API=`https://api.modrinth.com/v2/user/${encodeURIComponent(USERNAME)}`;
  const card=document.getElementById("card"),downloadsEl=document.getElementById("downloads"),projectsEl=document.getElementById("projects"),statusText=document.getElementById("statusText"),avatar=document.getElementById("avatar");
  let lastGoodTotal=null,animationFrame=null;
  const fmt=new Intl.NumberFormat("tr-TR");
  function easeOutCubic(t){return 1-Math.pow(1-t,3)}
  function animateValue(from,to,duration=900){if(animationFrame)cancelAnimationFrame(animationFrame);if(from===to){downloadsEl.textContent=fmt.format(to);return}const start=performance.now();downloadsEl.classList.remove("bump");void downloadsEl.offsetWidth;downloadsEl.classList.add("bump");function frame(now){const p=Math.min((now-start)/duration,1),e=easeOutCubic(p),cur=Math.round(from+(to-from)*e);downloadsEl.textContent=fmt.format(cur);if(p<1)animationFrame=requestAnimationFrame(frame);else{downloadsEl.textContent=fmt.format(to);setTimeout(()=>downloadsEl.classList.remove("bump"),500)}}animationFrame=requestAnimationFrame(frame)}
  async function refresh(){card.classList.remove("error");card.classList.add("loading");statusText.textContent="Güncelleniyor";try{const [projectsRes,userRes]=await Promise.all([fetch(PROJECTS_API,{cache:"no-store"}),fetch(USER_API,{cache:"no-store"})]);if(!projectsRes.ok)throw new Error(`HTTP ${projectsRes.status}`);const projects=await projectsRes.json();if(!Array.isArray(projects))throw new Error("Beklenmeyen API yanıtı");if(userRes.ok){const user=await userRes.json();if(user.avatar_url&&avatar.src!==user.avatar_url)avatar.src=user.avatar_url}const total=projects.reduce((sum,p)=>sum+Number(p.downloads||0),0),previousTotal=lastGoodTotal;lastGoodTotal=total;if(previousTotal===null)downloadsEl.textContent=fmt.format(total);else animateValue(previousTotal,total);projectsEl.textContent=fmt.format(projects.length);statusText.textContent="Canlı";card.classList.remove("loading","error")}catch(err){console.error("Modrinth sayaç hatası:",err);if(lastGoodTotal!==null)downloadsEl.textContent=fmt.format(lastGoodTotal);else downloadsEl.textContent="Bağlantı yok";projectsEl.textContent=projectsEl.textContent==="—"?"?":projectsEl.textContent;statusText.textContent="Tekrar denenecek";card.classList.remove("loading");card.classList.add("error")}}
  refresh();setInterval(refresh,REFRESH_MS);
})();
</script>
</body>
</html>
