<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PisanKusGaming • Modrinth İndirme Sayacı</title>
<style>
  :root{
    --card-w: 560px;
    --card-h: 176px;
    --safe-x: 48px;
    --safe-y: 48px;
    --green: #1bd96a;
    --green-soft: rgba(27,217,106,.20);
    --white: #f7f9fb;
    --muted: rgba(247,249,251,.68);
    --panel: rgba(13,17,20,.86);
    --line: rgba(255,255,255,.10);
  }

  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #stage{
    position:relative;
    width:100vw;
    height:100vh;
    background:transparent;
  }

  .card{
    position:absolute;
    right:var(--safe-x);
    bottom:var(--safe-y);
    width:var(--card-w);
    min-height:var(--card-h);
    padding:24px 26px 22px;
    border:1px solid var(--line);
    border-radius:24px;
    background:
      radial-gradient(110% 170% at 100% 0%, rgba(27,217,106,.16), transparent 45%),
      linear-gradient(145deg, rgba(17,22,26,.94), rgba(9,12,14,.90));
    box-shadow:
      0 18px 60px rgba(0,0,0,.34),
      inset 0 1px 0 rgba(255,255,255,.045);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color:var(--white);
  }

  .top{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:16px;
  }

  .logo{
    width:48px;
    height:48px;
    flex:0 0 48px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg, rgba(27,217,106,.26), rgba(27,217,106,.08));
    border:1px solid rgba(27,217,106,.34);
    box-shadow:0 0 28px rgba(27,217,106,.10);
  }

  .logo svg{
    width:29px;
    height:29px;
    display:block;
  }

  .identity{min-width:0}
  .name{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.35px;
    line-height:1.08;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .sub{
    margin-top:5px;
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:13px;
    font-weight:650;
    letter-spacing:.02em;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px rgba(27,217,106,.9);
  }

  .main{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
  }

  .label{
    color:var(--muted);
    font-size:13px;
    font-weight:750;
    letter-spacing:.11em;
    text-transform:uppercase;
    margin-bottom:3px;
  }

  .value{
    font-variant-numeric:tabular-nums;
    font-size:52px;
    line-height:1;
    font-weight:900;
    letter-spacing:-2px;
    text-shadow:0 0 28px rgba(255,255,255,.05);
  }

  .meta{
    text-align:right;
    color:var(--muted);
    font-size:12px;
    font-weight:650;
    line-height:1.45;
    padding-bottom:3px;
  }

  .status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:3px;
  }

  .pulse{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--green);
  }

  .loading .pulse{
    animation:pulse 1.1s ease-in-out infinite;
  }

  .error .pulse{
    background:#ffb24d;
  }

  @keyframes pulse{
    0%,100%{opacity:.35; transform:scale(.85)}
    50%{opacity:1; transform:scale(1.18)}
  }

  .bar{
    position:absolute;
    left:24px;
    right:24px;
    bottom:0;
    height:3px;
    overflow:hidden;
    border-radius:999px 999px 0 0;
    background:rgba(255,255,255,.04);
  }

  .bar::after{
    content:"";
    display:block;
    width:100%;
    height:100%;
    transform-origin:left;
    background:linear-gradient(90deg, transparent, var(--green), transparent);
    animation:scan 2.8s linear infinite;
    opacity:.75;
  }

  @keyframes scan{
    from{transform:translateX(-100%)}
    to{transform:translateX(100%)}
  }

  .value.bump{
    animation:valueBump .5s ease;
  }

  @keyframes valueBump{
    0%{transform:scale(1); filter:brightness(1)}
    40%{transform:scale(1.06); filter:brightness(1.18)}
    100%{transform:scale(1); filter:brightness(1)}
  }

  @media (max-width: 900px){
    :root{
      --card-w:min(560px, calc(100vw - 40px));
      --safe-x:20px;
      --safe-y:20px;
    }
    .value{font-size:44px}
  }
</style>
</head>
<body>
<div id="stage">
  <section class="card loading" id="card" aria-label="Modrinth toplam indirme sayacı">
    <div class="top">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4.2 16.1A8.4 8.4 0 0 1 17.8 6.2" stroke="#1bd96a" stroke-width="2.35" stroke-linecap="round"/>
          <path d="M19.7 8.1a8.4 8.4 0 0 1-13.5 9.8" stroke="#1bd96a" stroke-width="2.35" stroke-linecap="round"/>
          <path d="M15.6 5.4l2.6.4-.4 2.6" stroke="#1bd96a" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8.4 18.6l-2.6-.4.4-2.6" stroke="#1bd96a" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="identity">
        <div class="name">PisanKusGaming</div>
        <div class="sub"><span class="dot"></span> Modrinth profili</div>
      </div>
    </div>

    <div class="main">
      <div>
        <div class="label">Toplam İndirme</div>
        <div class="value" id="downloads">—</div>
      </div>
      <div class="meta">
        <div><span id="projects">—</span> proje</div>
        <div class="status"><span class="pulse"></span><span id="statusText">Güncelleniyor</span></div>
      </div>
    </div>
    <div class="bar"></div>
  </section>
</div>

<script>
(() => {
  const USERNAME = "pisankusgaming";
  const REFRESH_MS = 15_000;
  const API = `https://api.modrinth.com/v2/user/${encodeURIComponent(USERNAME)}/projects`;

  const card = document.getElementById("card");
  const downloadsEl = document.getElementById("downloads");
  const projectsEl = document.getElementById("projects");
  const statusText = document.getElementById("statusText");

  let lastGoodTotal = null;
  let animationFrame = null;

  const fmt = new Intl.NumberFormat("tr-TR");

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function animateValue(from, to, duration = 900) {
    if (animationFrame) cancelAnimationFrame(animationFrame);

    const start = performance.now();
    const safeFrom = Number.isFinite(from) ? from : 0;
    const safeTo = Number.isFinite(to) ? to : 0;

    if (safeFrom === safeTo) {
      downloadsEl.textContent = fmt.format(safeTo);
      return;
    }

    downloadsEl.classList.remove("bump");
    void downloadsEl.offsetWidth;
    downloadsEl.classList.add("bump");

    function frame(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = easeOutCubic(progress);
      const current = Math.round(safeFrom + (safeTo - safeFrom) * eased);
      downloadsEl.textContent = fmt.format(current);

      if (progress < 1) {
        animationFrame = requestAnimationFrame(frame);
      } else {
        downloadsEl.textContent = fmt.format(safeTo);
        setTimeout(() => downloadsEl.classList.remove("bump"), 500);
      }
    }

    animationFrame = requestAnimationFrame(frame);
  }

  async function refresh() {
    card.classList.remove("error");
    card.classList.add("loading");
    statusText.textContent = "Güncelleniyor";

    try {
      const res = await fetch(API, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const projects = await res.json();
      if (!Array.isArray(projects)) throw new Error("Beklenmeyen API yanıtı");

      const total = projects.reduce((sum, p) => sum + Number(p.downloads || 0), 0);
      const previousTotal = lastGoodTotal;
      lastGoodTotal = total;

      if (previousTotal === null) {
        downloadsEl.textContent = fmt.format(total);
      } else {
        animateValue(previousTotal, total);
      }

      projectsEl.textContent = fmt.format(projects.length);
      statusText.textContent = "Canlı";
      card.classList.remove("loading", "error");
    } catch (err) {
      console.error("Modrinth sayaç hatası:", err);

      if (lastGoodTotal !== null) {
        downloadsEl.textContent = fmt.format(lastGoodTotal);
      } else {
        downloadsEl.textContent = "Bağlantı yok";
      }

      projectsEl.textContent = projectsEl.textContent === "—" ? "?" : projectsEl.textContent;
      statusText.textContent = "Tekrar denenecek";
      card.classList.remove("loading");
      card.classList.add("error");
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
