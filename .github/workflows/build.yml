name: Build

# Pushes to the default branch are already fully built by the Release workflow,
# so this only guards pull requests.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm audit --omit=dev --audit-level=high

      - run: npm test

      - run: npm run build
