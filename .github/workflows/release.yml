name: Release

# Packages are published automatically: every push to main refreshes the rolling
# "latest" release, so the download page always has working links without anyone
# cutting a release by hand. Pushing a v* tag additionally publishes a pinned
# versioned release.
# Runs on whatever the repository's default branch is called, so packaging works
# before anyone creates a branch named "main".
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      # Rolling release. The tag is moved to the built commit each time, which is
      # what keeps github.com/<repo>/releases/latest/download/<name> resolving.
      - name: Publish rolling build
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: latest
          name: Son sürüm (otomatik)
          body: |
            `main` dalındaki son commit'ten otomatik üretilen paketler.

            Bu sürüm her push'ta güncellenir; aşağıdaki bağlantılar her zaman en yeni yapıyı indirir.
          prerelease: false
          make_latest: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
