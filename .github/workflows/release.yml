name: Desktop Release

# Desktop is the fast channel: every push to the repository default branch
# refreshes desktop-latest. Android is deliberately absent from this workflow.
on:
  push:
    branches: ['**']
    tags:
      - 'v*'
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security and behavior checks
        run: |
          npm audit --omit=dev --audit-level=high
          npm test

      - name: Stamp desktop version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            version="${GITHUB_REF#refs/tags/desktop-v}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            series=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            version="$series.$GITHUB_RUN_NUMBER"
          fi
          npm version --no-git-tag-version --allow-same-version "$version"
          echo "Masaüstü yapı sürümü: $version"

      - name: Cache packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Build installers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run ${{ matrix.script }}; then
              exit 0
            fi
            echo "::warning::Paketleme denemesi $attempt başarısız oldu, yeniden deneniyor…"
            sleep $((attempt * 20))
          done
          echo "::error::Paketleme üç denemede de başarısız oldu."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-desktop-packages
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish desktop channel
    needs: package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check packages
        run: |
          ls -lh artifacts
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::Hiçbir masaüstü paketi üretilemedi."
            exit 1
          fi

      - name: Publish rolling desktop channel
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: desktop-latest
          name: Masaüstü — son sürüm
          body: |
            Windows, macOS ve Linux için sık yayımlanan küçük güncellemeler.

            Bu kanal yalnızca masaüstü istemcileri içindir. Android sürümü ayrı yayımlanır.
          prerelease: false
          make_latest: true
          overwrite_files: true

      - name: Publish pinned desktop release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          make_latest: false
          overwrite_files: true
