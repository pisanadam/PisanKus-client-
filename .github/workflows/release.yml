name: Release

# Packages are published automatically: every push to main refreshes the rolling
# "latest" release, so the download page always has working links without anyone
# cutting a release by hand. Pushing a v* tag additionally publishes a pinned
# versioned release.
# Runs on whatever the repository's default branch is called, so packaging works
# before anyone creates a branch named "main".
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron-builder pulls its helper binaries (electron, nsis, winCodeSign…)
      # from GitHub releases on every run. Caching them removes most of the
      # network exposure that makes packaging flaky.
      - name: Cache packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      # Those downloads still fail outright now and then — a dropped connection
      # mid-transfer aborts the whole build. Retrying costs a few minutes; not
      # retrying leaves one platform's package stale on the rolling release.
      - name: Build installers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run ${{ matrix.script }}; then
              exit 0
            fi
            echo "::warning::Paketleme denemesi $attempt başarısız oldu, yeniden deneniyor…"
            sleep $((attempt * 20))
          done
          echo "::error::Paketleme üç denemede de başarısız oldu."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    # One platform failing should not withhold the packages that did build; the
    # download page reports any platform whose asset is missing. A matrix job's
    # result collapses to a single value, so this cannot test individual
    # platforms — the artifact check below decides whether there is anything to
    # publish.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check something was built
        run: |
          ls -lh artifacts
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::Hiçbir platform paketlenemedi; yayımlanacak dosya yok."
            exit 1
          fi

      # Rolling release. The tag is moved to the built commit each time, which is
      # what keeps github.com/<repo>/releases/latest/download/<name> resolving.
      - name: Publish rolling build
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: latest
          name: Son sürüm (otomatik)
          body: |
            `main` dalındaki son commit'ten otomatik üretilen paketler.

            Bu sürüm her push'ta güncellenir; aşağıdaki bağlantılar her zaman en yeni yapıyı indirir.
          prerelease: false
          make_latest: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
