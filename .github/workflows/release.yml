name: Release

# Packages are published automatically: every push to the default branch
# refreshes a rolling release, so the download page always has working links
# without anyone cutting a release by hand. Pushing a v* tag additionally
# publishes a pinned versioned release.
#
# Desktop and Android are separate channels — a different release tag each, and
# each built only when its own side of the repository changed. They ship the
# same product but not the same package, and a desktop-only change used to
# republish the APK too: the phone then offered an "update" that was byte for
# byte the app already installed, minus a version number.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Which side of the repository this push touched. A tag or a manual run
  # rebuilds everything, because that is what someone asking for a release
  # means by it.
  changes:
    name: Neler değişti
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Değişen dosyalara bak
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          both() {
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # A tag, a manual run, a brand-new branch or a force push over
          # rewritten history: in all of these there is no honest "what
          # changed", so everything is built.
          [ "$GITHUB_EVENT_NAME" = "push" ] || both
          [ -n "$BEFORE" ] || both
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || both

          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Değişen dosyalar:"; echo "$files"

          android=false
          desktop=false
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              # Documentation ships with neither package, wherever it lives.
              android/*.md|android/*/*.md) ;;
              android/*) android=true ;;
              # The workflow itself decides how both are built, so a change to
              # it rebuilds both.
              .github/workflows/release.yml) android=true; desktop=true ;;
              # The website and the docs ship with neither package.
              docs/*|*.md) ;;
              *) desktop=true ;;
            esac
          done <<< "$files"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "Android: $android · Masaüstü: $desktop"

  # The Android launcher. Signing needs no secrets: the release build falls back
  # to the keystore already committed in the repository, which is enough to make
  # the package installable. See app_pojavlauncher/build.gradle for what that
  # costs and when it must change.
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two JDKs, both required. Gradle itself runs on 17, but the MioLibPatcher
      # module asks for a language level 8 toolchain and the build stops during
      # configuration without one: "Cannot find a Java installation ... matching
      # {languageVersion=8}". Installing 8 last leaves JAVA_HOME on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The launcher compiles native code, so the exact NDK the project pins has
      # to be present; runners ship a different one.
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1"

      # Without these the APK ships with no Java runtime at all and the game
      # never starts: pickRuntime finds nothing and throws "Failed to autopick
      # runtime!". The runtimes are built separately and published as workflow
      # artifacts, which is why they are fetched rather than vendored.
      #
      # One per Java generation, because Minecraft needs different ones: 8 for
      # versions up to 1.16, 17 for 1.17–1.20.4, 21 for 1.20.5 and newer.
      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Get JRE 17
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav

      - name: Get JRE 21
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav

      # A missing runtime is the one failure that only shows up on a device, so
      # it is checked here instead.
      - name: Verify runtimes arrived
        run: |
          cd android/app_pojavlauncher/src/main/assets/components
          # Java 8 is the one the launcher cannot do without: every Minecraft
          # version needs some runtime, and 8 is the only one always published.
          count=$(find jre -type f 2>/dev/null | wc -l)
          echo "jre (Java 8): $count dosya"
          [ "$count" -gt 0 ] || { echo "::error::Java 8 çalışma zamanı inmemiş"; exit 1; }

          for dir in jre-new jre-21; do
            count=$(find "$dir" -type f 2>/dev/null | wc -l)
            echo "$dir: $count dosya"
            [ "$count" -gt 0 ] || echo "::warning::$dir yok — bu Java'yı isteyen Minecraft sürümleri başlamayacak"
          done

      - name: Build
        working-directory: android
        env:
          # Monotonic, so an installed copy always sees a published build as
          # newer. Android upgrades strictly by this number.
          PISANKUS_BUILD: ${{ github.run_number }}
        run: |
          ./gradlew --no-daemon \
            -Porg.gradle.java.installations.paths="${JAVA_HOME_8_X64},${JAVA_HOME_17_X64}" \
            :app_pojavlauncher:assembleDebug :app_pojavlauncher:assembleRelease

      # Proves the branding actually reached the package rather than just the
      # build files: a build type's resValue can quietly override app_name.
      - name: Verify identity
        working-directory: android
        run: |
          badging=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging \
            app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk)
          echo "$badging" | grep -E "^package: name|application-label:'"
          echo "$badging" | grep -q "name='com.pisankus.client" \
            || { echo "::error::Paket adı PisanKus değil"; exit 1; }
          echo "$badging" | grep -q "application-label:'PisanKus Client" \
            || { echo "::error::Uygulama etiketi PisanKus Client değil"; exit 1; }

      - name: Package signed APK
        working-directory: android
        run: |
          apk=app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk
          [ -f "$apk" ] || { echo "::error::İmzalı APK üretilmedi."; exit 1; }
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify "$apk"
          mkdir -p out && cp "$apk" out/PisanKusClient-android.apk

          # The version the app compares against before downloading 150 MB.
          # Read out of the built package rather than recomputed here, so it is
          # the number Android itself will see.
          badging=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$apk")
          code=$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          [ -n "$code" ] || { echo "::error::versionCode okunamadı"; exit 1; }
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$code" "$name" > out/android-version.json
          cat out/android-version.json

      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: android/out/*
          if-no-files-found: error

  package:
    name: Package ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Security and behavior checks
        run: |
          npm audit --omit=dev --audit-level=high
          npm test

      # electron-updater compares the version inside latest*.yml against the
      # version of the installed build. package.json alone never changes, so
      # every rolling build would look identical to the one already installed
      # and no update would ever be offered. The run number is monotonic, which
      # is all semver needs here.
      - name: Stamp build version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            series=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
            version="$series.$GITHUB_RUN_NUMBER"
          fi
          npm version --no-git-tag-version --allow-same-version "$version"
          echo "Yapı sürümü: $version"

      # electron-builder pulls its helper binaries (electron, nsis, winCodeSign…)
      # from GitHub releases on every run. Caching them removes most of the
      # network exposure that makes packaging flaky.
      - name: Cache packaging binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      # Those downloads still fail outright now and then — a dropped connection
      # mid-transfer aborts the whole build. Retrying costs a few minutes; not
      # retrying leaves one platform's package stale on the rolling release.
      # Signing credentials, exported only when they actually exist.
      #
      # Listing them under the build step's `env:` instead would define every
      # one of them as an empty string on a repository that has no such secrets
      # — GitHub substitutes "" for a missing secret rather than leaving the
      # variable out. electron-builder decides whether to sign by looking at
      # these very variables, so a defined-but-empty CSC_LINK is a signing
      # attempt with no certificate. Writing them to $GITHUB_ENV only when
      # non-empty keeps an unsigned build byte-for-byte the build it was before
      # any of this existed.
      - name: Prepare signing credentials
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          keep() {
            [ -n "$2" ] || return 0
            echo "$1=$2" >> "$GITHUB_ENV"
          }
          # A normal OV/EV certificate: base64 of the .pfx, plus its password.
          keep CSC_LINK "$CERTIFICATE"
          keep CSC_KEY_PASSWORD "$CERTIFICATE_PASSWORD"
          # Azure Trusted Signing, which is what satisfies Smart App Control
          # without a certificate costing hundreds a year.
          keep AZURE_TENANT_ID "$TENANT_ID"
          keep AZURE_CLIENT_ID "$CLIENT_ID"
          keep AZURE_CLIENT_SECRET "$CLIENT_SECRET"

          if [ -n "$CERTIFICATE" ] || [ -n "$TENANT_ID" ]; then
            echo "İmzalama açık."
          else
            echo "İmzalama kapalı: paket imzasız üretilecek."
          fi

      - name: Build installers
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run ${{ matrix.script }}; then
              exit 0
            fi
            echo "::warning::Paketleme denemesi $attempt başarısız oldu, yeniden deneniyor…"
            sleep $((attempt * 20))
          done
          echo "::error::Paketleme üç denemede de başarısız oldu."
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-packages
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  publish-desktop:
    name: Publish desktop
    needs: package
    # One platform failing should not withhold the packages that did build; the
    # download page reports any platform whose asset is missing. A matrix job's
    # result collapses to a single value, so this cannot test individual
    # platforms — the artifact check below decides whether there is anything to
    # publish.
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-packages'
          merge-multiple: true

      - name: Check something was built
        run: |
          ls -lh artifacts
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::Hiçbir platform paketlenemedi; yayımlanacak dosya yok."
            exit 1
          fi

      # Rolling release. The tag is moved to the built commit each time, which is
      # what keeps github.com/<repo>/releases/latest/download/<name> resolving.
      - name: Publish rolling build
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: latest
          name: Son sürüm (otomatik)
          body: |
            `main` dalındaki son commit'ten otomatik üretilen masaüstü paketleri.

            Bu sürüm her masaüstü değişikliğinde güncellenir; aşağıdaki bağlantılar her zaman en yeni yapıyı indirir.

            Android paketi ayrı yayımlanır: [android](../../releases/tag/android).
          prerelease: false
          make_latest: true

      # The rolling release is never recreated, only added to, so an artifact
      # that changes name leaves its predecessor sitting there for good. That is
      # exactly what the Opbay → PisanKus rename did: both sets of installers
      # ended up side by side, with the retired brand still on the page.
      #
      # Only files whose name no longer matches the build are removed, so a
      # platform that failed this run keeps the copy it published last time —
      # which is the whole point of publishing partial builds. The APK is the
      # one exception: it has a release of its own now, and the copy left here
      # by the old single-channel builds would sit unchanged for ever.
      - name: Retire renamed assets
        if: startsWith(github.ref, 'refs/tags/') == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=$(ls artifacts | grep -m1 -E '\.(exe|dmg|AppImage|deb)$' | sed 's/-.*//')
          if [ -z "$prefix" ]; then
            echo "::warning::Kurulum dosyası bulunamadı; temizlik atlanıyor."
            exit 0
          fi
          echo "Geçerli önek: $prefix"

          gh release view latest --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > existing.txt

          while read -r name; do
            case "$name" in
              '') continue ;;
              *.apk|android-version.json) ;;   # belongs to the android release
              latest*.yml|"$prefix"-*) continue ;;
            esac
            echo "Bu yayına ait olmayan dosya siliniyor: $name"
            gh release delete-asset latest "$name" --repo "$GITHUB_REPOSITORY" --yes
          done < existing.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-android:
    name: Publish Android
    needs: android
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-package
          path: artifacts

      - run: ls -lh artifacts

      # Its own rolling tag. The app reads this release and nothing else, so a
      # desktop build cannot make a phone think there is something to install.
      - name: Publish Android build
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: android
          name: Android (otomatik)
          body: |
            Android paketi. Her Android değişikliğinde güncellenir.

            `android-version.json`, uygulamanın indirmeden önce baktığı sürüm
            bilgisini taşır.
          prerelease: false
          # The desktop release stays the one GitHub calls "latest": that is
          # where electron-updater and the download page's default links look.
          make_latest: false
