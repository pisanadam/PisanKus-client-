name: Android

# The APK is published automatically alongside the desktop packages, so the
# download page always has an installable build without anyone cutting a release.
# Runs on whatever the repository's default branch is called, so the APK is
# published before anyone creates a branch named "main".
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Name the artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk OpbayClient-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/OpbayClient-android.apk
          if-no-files-found: error

      - name: Publish to rolling release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          files: android/OpbayClient-android.apk
          tag_name: latest
          name: Son sürüm (otomatik)
          prerelease: false
          make_latest: true

      - name: Publish to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/OpbayClient-android.apk
